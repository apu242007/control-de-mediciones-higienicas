name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  probar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No hay dependencias que instalar: las pruebas usan el ejecutor propio
      # de Node. Si falla alguna, el despliegue no corre.
      #
      # El detalle del fallo se emite como anotacion (::error::) y no solo al
      # log: las anotaciones se pueden leer por la API sin credenciales, el log
      # no. Sin esto, diagnosticar un fallo de CI desde afuera es a ciegas.
      # `node --test` SIN argumento de ruta, a propósito: descubre los archivos
      # por patrón (**/*.test.mjs) y funciona igual en Node 18, 20 y 22.
      # Pasarle `pruebas/` rompe en Node 22, que trata el argumento como un
      # módulo a ejecutar en vez de como un directorio a escanear:
      #   Error: Cannot find module '/home/runner/work/.../pruebas'
      - name: Pruebas de la lógica
        run: |
          set +e
          node --test > /tmp/salida.tap 2>&1
          codigo=$?
          cat /tmp/salida.tap
          if [ $codigo -ne 0 ]; then
            detalle=$(grep -E '^not ok|AssertionError|SyntaxError|Cannot find|^# (pass|fail|tests)|expected:|actual:|Error \[' /tmp/salida.tap \
                      | head -40 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Pruebas fallaron en Node ${{ matrix.node }}::${detalle}"
          fi
          exit $codigo

  construir:
    needs: probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El sitio es HTML estatico: no hay build. Lo unico que hace falta es
      # poner los valores reales donde config.js tiene los marcadores.
      #
      # Se usa Python con reemplazo literal en vez de sed: la URL del flow trae
      # '/', '?', '&' y '=', que sed interpretaria como parte de su sintaxis.
      - name: Inyectar configuración
        env:
          URL_FLOW: ${{ secrets.URL_FLOW }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          python3 - <<'PY'
          import os, sys, pathlib

          ruta = pathlib.Path("web-app/assets/config.js")
          texto = ruta.read_text(encoding="utf-8")

          url = os.environ.get("URL_FLOW", "").strip()
          key = os.environ.get("APP_KEY", "").strip()

          # Sin URL_FLOW el sitio se publica igual, en modo demo. Es un estado
          # legitimo mientras los flows todavia no existen: deja revisar el
          # formulario y los catalogos en el sitio real. La app lo avisa con un
          # cartel arriba y el boton de enviar devuelve un error explicito, asi
          # que nadie puede creer que cargo algo que no se guardo.
          if not url:
              print("::warning title=Sitio en modo demo::"
                    "Falta el secret URL_FLOW, asi que el sitio se publica en modo demo y "
                    "no guarda nada en SharePoint. Cargalo en Settings / Secrets and "
                    "variables / Actions cuando el flow MED-API este armado.")
          elif not url.startswith("https://"):
              # Esto si es un error de configuracion, no un estado pendiente.
              print("::error title=URL_FLOW invalida::"
                    "No arranca con https://. Revisa que se haya copiado completa.")
              sys.exit(1)

          if url and not key:
              print("::warning title=Falta APP_KEY::"
                    "Si el flow tiene la verificacion de clave activada, va a rechazar "
                    "todas las llamadas con 401.")

          for marcador, valor in (("__URL_FLOW__", url), ("__APP_KEY__", key)):
              if marcador not in texto:
                  print(f"::error::No se encontro el marcador {marcador} en config.js.")
                  sys.exit(1)
              texto = texto.replace(marcador, valor)

          ruta.write_text(texto, encoding="utf-8")
          print("Configuracion inyectada.")
          PY

      # Verificacion: que no haya quedado ningun marcador sin reemplazar, y que
      # el secret no se filtre al log. Solo se informa si aparece un marcador.
      - name: Verificar que no queden marcadores
        run: |
          if grep -q '__URL_FLOW__\|__APP_KEY__' web-app/assets/config.js; then
            echo "::error::Quedaron marcadores sin reemplazar en config.js."
            exit 1
          fi
          echo "config.js listo."

      # GitHub Pages sirve 404.html ante cualquier ruta desconocida.
      - name: Página de respaldo
        run: cp web-app/index.html web-app/404.html

      # GitHub Pages hay que activarlo UNA vez a mano, antes del primer
      # despliegue: Settings -> Pages -> Source: GitHub Actions.
      #
      # `enablement: true` promete hacerlo solo, pero el GITHUB_TOKEN del
      # workflow no tiene permiso para crear el sitio y falla con "Resource not
      # accessible by integration". Se probó y no sirve.
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Ayuda si Pages no está activado
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "::error title=Falta activar GitHub Pages::"\
          "Andá a Settings / Pages del repositorio y poné Source: GitHub Actions. "\
          "Después volvé a lanzar este workflow desde la pestaña Actions. "\
          "Es un paso único: los despliegues siguientes ya no lo necesitan."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-app

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
