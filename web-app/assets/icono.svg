<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="Mediciones higiénicas de luz y ruido">
  <rect width="512" height="512" rx="96" fill="#0b3d6b"/>

  <!-- Sol: la parte de iluminación -->
  <circle cx="176" cy="168" r="46" fill="#ffd257"/>
  <g stroke="#ffd257" stroke-width="17" stroke-linecap="round">
    <line x1="176" y1="82"  x2="176" y2="104"/>
    <line x1="176" y1="232" x2="176" y2="254"/>
    <line x1="90"  y1="168" x2="112" y2="168"/>
    <line x1="240" y1="168" x2="262" y2="168"/>
    <line x1="115" y1="107" x2="131" y2="123"/>
    <line x1="221" y1="213" x2="237" y2="229"/>
    <line x1="115" y1="229" x2="131" y2="213"/>
    <line x1="221" y1="123" x2="237" y2="107"/>
  </g>

  <!-- Ondas: la parte de ruido -->
