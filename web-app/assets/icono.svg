    <rect x="178" y="352" width="46"  height="96" rx="9"/>
    <rect x="244" y="314" width="46"  height="134" rx="9"/>
    <rect x="310" y="342" width="46"  height="106" rx="9"/>
  </g>
  <rect x="96" y="452" width="320" height="14" rx="7" fill="#7fd4ff"/>
</svg>
